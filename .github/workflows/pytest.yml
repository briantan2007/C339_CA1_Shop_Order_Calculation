name: CA1 Automated Pytest CI

on: push 

jobs: 
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 
        uses: actions/setup-python@v5
        with: 
          python-version: "3.12"

      - name: Install pytest
        run: pip Install pytest

      - name: Run pytest
        run: python -m pytest --cov-report=term-missing